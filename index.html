<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --grid: #243247;
      --snake: #22c55e;
      --head: #86efac;
      --food: #f43f5e;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    h1 { margin: 0; font-size: 1.75rem; letter-spacing: 0.05em; }
    .stats { display: flex; gap: 24px; color: var(--muted); }
    .stats b { color: var(--text); }
    canvas {
      width: min(90vw, 480px);
      height: min(90vw, 480px);
      background: var(--panel);
      border-radius: 12px;
      touch-action: none;
    }
    .hint { color: var(--muted); font-size: 0.9rem; text-align: center; }
    .pad { display: none; grid-template-columns: repeat(3, 56px); gap: 8px; }
    .pad button {
      height: 56px;
      border: 0;
      border-radius: 10px;
      background: var(--panel);
      color: var(--text);
      font-size: 1.25rem;
    }
    .pad .up { grid-column: 2; }
    .pad .left { grid-column: 1; grid-row: 2; }
    .pad .down { grid-column: 2; grid-row: 2; }
    .pad .right { grid-column: 3; grid-row: 2; }
    @media (pointer: coarse) { .pad { display: grid; } }
  </style>
</head>
<body>
  <h1>SNAKE</h1>
  <div class="stats">
    <span>Score: <b id="score">0</b></span>
    <span>Best: <b id="best">0</b></span>
  </div>
  <canvas id="board" width="480" height="480"></canvas>
  <div class="pad">
    <button class="up" data-dir="up">▲</button>
    <button class="left" data-dir="left">◀</button>
    <button class="down" data-dir="down">▼</button>
    <button class="right" data-dir="right">▶</button>
  </div>
  <p class="hint">Arrow keys / WASD to move · Space to pause · Swipe on mobile</p>
  <script src="game.js"></script>
</body>
</html>
